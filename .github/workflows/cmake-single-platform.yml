name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_TYPE: Release

  
jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v2
        with:
          python-version: 3.12

      - name: Install Scoop - setup - build
        shell: pwsh
        run: |
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
            scoop bucket add openttd https://github.com/WenSimEHRP/OpenTTD-Bucket
            scoop install openttd/nml
            scoop install openttd/gorender
            cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            cmake --build build --target Bundles --config ${{ env.BUILD_TYPE }}

      - name: Prepare package
        run: |
          mkdir -p package
          cp -v build/bin/*.grf package/ || true
          cp -v build/bin/*.tar* package/ || true
          cp -v build/bin/*.txt package/ || true
          ls -lh package


      # 6️⃣ 上传构建产物（可下载）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WAS-${{ env.BUILD_TYPE }}
          path: package/*

    # 7️⃣ （可选）在 tag 推送时创建 GitHub Release 并附带产物
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: package/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
